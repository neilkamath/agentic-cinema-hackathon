<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Sidecast</title>
  <link rel="icon" type="image/svg+xml" href="../favicon.svg" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    rel="stylesheet"
    href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;700&family=IBM+Plex+Mono:wght@400;500&display=swap"
  />
  <link rel="stylesheet" href="https://unpkg.com/open-props" />
  <link rel="stylesheet" href="../panel/panel.css" />
</head>
<body>
  <div id="app">
    <div id="main">
      <div id="video-header">
        <a id="back-link" class="icon-back-button" href="../index.html" aria-label="Back to Sidecast" title="Back to Sidecast">&larr;</a>
        <div id="video-meta">
          <div id="video-title"></div>
          <div id="video-channel"></div>
        </div>
      </div>
      <div id="player"></div>
    </div>
    <div id="divider"></div>
    <div id="chat-column">
      <div class="panel-label">Streamed Chat</div>
      <div id="panel">
        <div id="start-feed">
          <button id="start-feed-button" class="btn-primary" type="button">Watch with Sidecast</button>
          <div id="start-feed-hint">Loads synced comments and fact cards for this video.</div>
        </div>
      </div>
    </div>
  </div>
  <script src="https://www.youtube.com/iframe_api"></script>
  <script type="module" src="app.js"></script>
</body>
</html>
