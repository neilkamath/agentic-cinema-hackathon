<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Sidecast</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    rel="stylesheet"
    href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&family=Roboto+Mono:wght@400;500&display=swap"
  />
  <link rel="stylesheet" href="https://unpkg.com/open-props" />
  <link rel="stylesheet" href="panel/panel.css" />
  <link rel="stylesheet" href="home.css" />
  <script>
    // Set before first paint so the entrance-animated elements (see home.css)
    // start hidden instead of flashing visible-then-hidden-then-faded-in.
    // The timeout is a hard fallback in case Motion's CDN import never
    // resolves - the page must still reveal everything, just without the
    // animation, rather than staying blank.
    document.documentElement.classList.add("motion-pending");
    setTimeout(() => document.documentElement.classList.remove("motion-pending"), 700);
  </script>
</head>
<body>
  <img class="home-logo" src="favicon.svg" alt="" />
  <div class="home-title">Sidecast</div>
  <div class="home-tagline">Enjoy any of your favorite videos with synced comments, plus time-synced fact cards for our featured picks.</div>
  <a class="howto-link" href="how-to.html">How it works</a>

  <form class="paste-form" id="paste-form" autocomplete="off">
    <input
      id="paste-input"
      type="text"
      placeholder="Paste a YouTube link or video ID"
      aria-label="YouTube link or video ID"
      spellcheck="false"
    />
    <button type="submit" id="paste-button">Go</button>
  </form>
  <div class="paste-error" id="paste-error" role="status" aria-live="polite"></div>

  <div class="home-section-label">or pick one</div>
  <div class="video-grid" id="video-grid"></div>

  <div id="modal-backdrop">
    <div id="modal-card">
      <a id="modal-back" class="icon-back-button" href="#" aria-label="Close" title="Close">&larr;</a>
      <div id="modal-thumb">
        <img id="modal-thumb-img" src="" alt="" />
        <button id="modal-start-button" type="button">Start Sidecast</button>
      </div>
      <div id="modal-info">
        <div id="modal-channel"></div>
        <div id="modal-title"></div>
      </div>
    </div>
  </div>

  <script type="module">
    import { API_BASE } from "./panel/panel.js";

    // Pinned version, per Motion's own docs, rather than @latest - this page
    // has to keep working unattended through the hackathon judging window,
    // so a CDN import shouldn't be able to silently change behavior underneath it.
    const motionReady = import("https://cdn.jsdelivr.net/npm/motion@13.1.1/+esm").catch((err) => {
      console.error("Motion failed to load, entrance/modal animations are skipped", err);
      return null;
    });

    const VIDEOS = [
      {
        id: "mc9WVVAUQGE",
        title: "Tom Holland and Jon Bernthal Team Up While Eating Spicy Wings",
        channel: "Hot Ones",
        timeSynced: true,
      },
      {
        id: "uxPdPpi5W4o",
        title: "Why Are 96,000,000 Black Balls on This Reservoir?",
        channel: "Veritasium",
        timeSynced: true,
      },
      {
        id: "sOS9aOIXPEk",
        title: "Something About Us",
        channel: "Daft Punk",
      },
      {
        id: "irVNGjRFZGk",
        title: "Avengers: Doomsday | Official Trailer | In Theaters December 18",
        channel: "Marvel Entertainment",
      },
    ];

    // Local dev points the watch page at a local backend via ?api=...;
    // carry that through so this homepage works the same way whether it's
    // loaded locally or from the eventual hosted link.
    const api = new URLSearchParams(location.search).get("api");

    function watchUrl(videoId) {
      const params = new URLSearchParams({ v: videoId });
      if (api) params.set("api", api);
      return `webapp/index.html?${params.toString()}`;
    }

    const grid = document.getElementById("video-grid");
    for (const video of VIDEOS) {
      const card = document.createElement("a");
      card.className = "video-card";
      card.href = watchUrl(video.id);

      const syncBadge = video.timeSynced
        ? `<div class="sync-badge" title="Fact cards are synced to real moments in this video"><span>Synced</span></div>`
        : "";
      card.innerHTML = `
        <div class="video-thumb">
          <img src="https://img.youtube.com/vi/${video.id}/hqdefault.jpg" alt="${video.title}" loading="lazy" />
          ${syncBadge}
        </div>
        <div class="video-info">
          <div class="video-channel">${video.channel}</div>
          <div class="video-title">${video.title}</div>
        </div>
      `;
      // A real link (so right-click / open-in-new-tab still works and
      // falls back to the watch page's own start button), but a plain
      // click opens the start popup instead of navigating immediately.
      card.addEventListener("click", (e) => {
        e.preventDefault();
        openModal(video);
      });
      grid.appendChild(card);
    }

    // Progressive enhancement: the page is fully usable the instant this
    // script runs; the entrance animation just layers on top once Motion's
    // CDN import resolves, however long that takes.
    motionReady.then((motion) => {
      document.documentElement.classList.remove("motion-pending");
      if (!motion) return;
      const { animate, stagger } = motion;
      animate(
        ".home-logo, .home-title, .home-tagline, .howto-link, .paste-form, .home-section-label",
        { opacity: [0, 1], y: [10, 0] },
        { duration: 0.4, delay: stagger(0.06), ease: "easeOut" }
      );
      animate(
        ".video-card",
        { opacity: [0, 1], y: [16, 0] },
        { duration: 0.45, delay: stagger(0.06, { startDelay: 0.3 }), ease: "easeOut" }
      );
    });

    // Accepts the shapes people actually paste: a full watch URL, a share
    // link, an /embed/ or /v/ URL, or the bare 11-character ID. Shorts and
    // live links parse fine but aren't a supported player mode here (no
    // fixed-length transcript to sync insights against), so they're
    // reported back as their own `kind` instead of a plain ID - the caller
    // decides how to message each case.
    function parseVideoLink(raw) {
      const input = raw.trim();
      if (!input) return null;
      if (/^[\w-]{11}$/.test(input)) return { id: input, kind: "video" };

      let url;
      try {
        url = new URL(input.includes("://") ? input : `https://${input}`);
      } catch {
        return null;
      }

      const host = url.hostname.replace(/^www\./, "");
      if (host === "youtu.be") {
        const id = url.pathname.slice(1).split("/")[0];
        return /^[\w-]{11}$/.test(id) ? { id, kind: "video" } : null;
      }
      if (host !== "youtube.com" && host !== "m.youtube.com" && host !== "music.youtube.com") {
        return null;
      }

      const shortsMatch = url.pathname.match(/^\/shorts\/([\w-]{11})/);
      if (shortsMatch) return { id: shortsMatch[1], kind: "shorts" };

      const liveMatch = url.pathname.match(/^\/live\/([\w-]{11})/);
      if (liveMatch) return { id: liveMatch[1], kind: "live" };

      const v = url.searchParams.get("v");
      if (v && /^[\w-]{11}$/.test(v)) return { id: v, kind: "video" };

      const match = url.pathname.match(/^\/(?:embed|v)\/([\w-]{11})/);
      return match ? { id: match[1], kind: "video" } : null;
    }

    const UNSUPPORTED_LINK_MESSAGES = {
      shorts: "Shorts aren't supported here - paste a regular video link.",
      live: "Live videos aren't supported here - paste a regular video link.",
    };

    const pasteForm = document.getElementById("paste-form");
    const pasteInput = document.getElementById("paste-input");
    const pasteButton = document.getElementById("paste-button");
    const pasteError = document.getElementById("paste-error");

    pasteInput.addEventListener("input", () => {
      pasteError.textContent = "";
    });

    pasteForm.addEventListener("submit", async (e) => {
      e.preventDefault();
      const parsed = parseVideoLink(pasteInput.value);
      if (!parsed) {
        pasteError.textContent = "That doesn't look like a YouTube link or video ID.";
        return;
      }
      if (parsed.kind in UNSUPPORTED_LINK_MESSAGES) {
        pasteError.textContent = UNSUPPORTED_LINK_MESSAGES[parsed.kind];
        return;
      }
      const videoId = parsed.id;

      pasteError.textContent = "";
      pasteButton.disabled = true;
      pasteButton.textContent = "…";

      // Look the video up before opening the modal so a typo'd-but-valid ID,
      // or a still-live/upcoming broadcast pasted as a normal watch link
      // (indistinguishable from a regular ID by shape alone), fails here
      // with a message instead of opening a modal that then breaks on the
      // expensive preload.
      try {
        const res = await fetch(`${API_BASE}/video/${videoId}`);
        if (!res.ok) throw new Error(String(res.status));
        const meta = await res.json();
        if (meta.live_broadcast_content && meta.live_broadcast_content !== "none") {
          pasteError.textContent = UNSUPPORTED_LINK_MESSAGES.live;
          return;
        }
        openModal({ id: videoId, title: meta.title, channel: meta.channel_title });
      } catch (err) {
        console.error("video lookup failed", err);
        pasteError.textContent = "Couldn't find that video. Check the link and try again.";
      } finally {
        pasteButton.disabled = false;
        pasteButton.textContent = "Go";
      }
    });

    const backdrop = document.getElementById("modal-backdrop");
    const modalCard = document.getElementById("modal-card");
    const modalBack = document.getElementById("modal-back");
    const modalThumb = document.getElementById("modal-thumb");
    const modalThumbImg = document.getElementById("modal-thumb-img");
    const modalStartButton = document.getElementById("modal-start-button");
    const modalChannel = document.getElementById("modal-channel");
    const modalTitle = document.getElementById("modal-title");

    let activeVideo = null;
    // Closing the modal doesn't cancel the in-flight preload fetch below -
    // it keeps running and navigates once it resolves regardless. Blocking
    // dismissal while it's in progress avoids the confusing "I cancelled
    // this" moment where the video page opens anyway a second later.
    let isStarting = false;

    function openModal(video) {
      activeVideo = video;
      modalThumbImg.src = `https://img.youtube.com/vi/${video.id}/hqdefault.jpg`;
      modalThumbImg.alt = video.title;
      modalChannel.textContent = video.channel;
      modalTitle.textContent = video.title;
      modalThumb.innerHTML = "";
      modalThumb.appendChild(modalThumbImg);
      modalThumb.appendChild(modalStartButton);
      modalStartButton.disabled = false;
      modalStartButton.textContent = "Start Sidecast";
      modalBack.classList.remove("disabled");
      backdrop.classList.add("visible");

      // A bare class-toggle opacity fade (still handled by CSS) reads as
      // static; the card itself gets a springy pop on top of that so opening
      // feels like something arriving, not just appearing.
      motionReady.then((motion) => {
        if (!motion) return;
        motion.animate(
          modalCard,
          { opacity: [0, 1], scale: [0.92, 1] },
          { type: "spring", bounce: 0.25, duration: 0.4 }
        );
      });
    }

    function closeModal() {
      if (isStarting) return;
      backdrop.classList.remove("visible");
      motionReady.then((motion) => {
        if (!motion) return;
        motion.animate(modalCard, { opacity: [1, 0], scale: [1, 0.95] }, { duration: 0.15, ease: "easeIn" });
      });
      activeVideo = null;
    }

    modalBack.addEventListener("click", (e) => {
      e.preventDefault();
      closeModal();
    });
    backdrop.addEventListener("click", (e) => {
      if (e.target === backdrop) closeModal();
    });
    document.addEventListener("keydown", (e) => {
      if (e.key === "Escape" && backdrop.classList.contains("visible")) closeModal();
    });

    // Fetch comments and insights (the expensive Gemini + Parallel Search
    // part) here, before navigating - so by the time the watch page opens,
    // the player, comments, and fact cards are all already ready, instead
    // of the viewer landing on a page that then has to load.
    modalStartButton.addEventListener("click", async () => {
      const video = activeVideo;
      if (!video) return;

      isStarting = true;
      modalBack.classList.add("disabled");
      modalStartButton.disabled = true;
      modalThumb.innerHTML = `
        <div class="modal-loading">
          <img class="loading-spinner" src="favicon.svg" alt="" />
          <div>Setting up Sidecast…</div>
        </div>
      `;

      try {
        const [commentsRes, insightsRes] = await Promise.all([
          fetch(`${API_BASE}/comments/${video.id}`),
          fetch(`${API_BASE}/video/${video.id}/insights`),
        ]);
        const [comments, insights] = await Promise.all([commentsRes.json(), insightsRes.json()]);
        sessionStorage.setItem(`sidecast:preload:${video.id}`, JSON.stringify({ comments, insights }));
      } catch (err) {
        console.error("preload failed, watch page will load its own data", err);
      }

      location.href = watchUrl(video.id);
    });
  </script>
</body>
</html>
