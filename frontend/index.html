<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Sidecast</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    rel="stylesheet"
    href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&family=Roboto+Mono:wght@400;500&display=swap"
  />
  <link rel="stylesheet" href="https://unpkg.com/open-props" />
  <link rel="stylesheet" href="panel/panel.css" />
  <link rel="stylesheet" href="home.css" />
</head>
<body>
  <div class="home-title">Sidecast</div>
  <div class="home-tagline">Pick a video to watch with synced comments and fact cards.</div>

  <div class="video-grid" id="video-grid"></div>

  <div id="modal-backdrop">
    <div id="modal-card">
      <a id="modal-back" class="icon-back-button" href="#" aria-label="Close" title="Close">&larr;</a>
      <div id="modal-thumb">
        <img id="modal-thumb-img" src="" alt="" />
        <button id="modal-start-button" type="button">Start Sidecast</button>
      </div>
      <div id="modal-info">
        <div id="modal-channel"></div>
        <div id="modal-title"></div>
      </div>
    </div>
  </div>

  <script type="module">
    import { API_BASE } from "./panel/panel.js";

    const VIDEOS = [
      {
        id: "mc9WVVAUQGE",
        title: "Tom Holland and Jon Bernthal Team Up While Eating Spicy Wings",
        channel: "Hot Ones",
      },
      {
        id: "uxPdPpi5W4o",
        title: "Why Are 96,000,000 Black Balls on This Reservoir?",
        channel: "Veritasium",
      },
      {
        id: "sOS9aOIXPEk",
        title: "Something About Us",
        channel: "Daft Punk",
      },
    ];

    // Local dev points the watch page at a local backend via ?api=...;
    // carry that through so this homepage works the same way whether it's
    // loaded locally or from the eventual hosted link.
    const api = new URLSearchParams(location.search).get("api");

    function watchUrl(videoId) {
      const params = new URLSearchParams({ v: videoId });
      if (api) params.set("api", api);
      return `webapp/index.html?${params.toString()}`;
    }

    const grid = document.getElementById("video-grid");
    for (const video of VIDEOS) {
      const card = document.createElement("a");
      card.className = "video-card";
      card.href = watchUrl(video.id);

      card.innerHTML = `
        <div class="video-thumb">
          <img src="https://img.youtube.com/vi/${video.id}/hqdefault.jpg" alt="${video.title}" loading="lazy" />
        </div>
        <div class="video-info">
          <div class="video-channel">${video.channel}</div>
          <div class="video-title">${video.title}</div>
        </div>
      `;
      // A real link (so right-click / open-in-new-tab still works and
      // falls back to the watch page's own start button), but a plain
      // click opens the start popup instead of navigating immediately.
      card.addEventListener("click", (e) => {
        e.preventDefault();
        openModal(video);
      });
      grid.appendChild(card);
    }

    const backdrop = document.getElementById("modal-backdrop");
    const modalBack = document.getElementById("modal-back");
    const modalThumb = document.getElementById("modal-thumb");
    const modalThumbImg = document.getElementById("modal-thumb-img");
    const modalStartButton = document.getElementById("modal-start-button");
    const modalChannel = document.getElementById("modal-channel");
    const modalTitle = document.getElementById("modal-title");

    let activeVideo = null;

    function openModal(video) {
      activeVideo = video;
      modalThumbImg.src = `https://img.youtube.com/vi/${video.id}/hqdefault.jpg`;
      modalThumbImg.alt = video.title;
      modalChannel.textContent = video.channel;
      modalTitle.textContent = video.title;
      modalThumb.innerHTML = "";
      modalThumb.appendChild(modalThumbImg);
      modalThumb.appendChild(modalStartButton);
      modalStartButton.disabled = false;
      modalStartButton.textContent = "Start Sidecast";
      backdrop.classList.add("visible");
    }

    function closeModal() {
      backdrop.classList.remove("visible");
      activeVideo = null;
    }

    modalBack.addEventListener("click", (e) => {
      e.preventDefault();
      closeModal();
    });
    backdrop.addEventListener("click", (e) => {
      if (e.target === backdrop) closeModal();
    });
    document.addEventListener("keydown", (e) => {
      if (e.key === "Escape" && backdrop.classList.contains("visible")) closeModal();
    });

    // Fetch comments and insights (the expensive Gemini + Parallel Search
    // part) here, before navigating - so by the time the watch page opens,
    // the player, comments, and fact cards are all already ready, instead
    // of the viewer landing on a page that then has to load.
    modalStartButton.addEventListener("click", async () => {
      const video = activeVideo;
      if (!video) return;

      modalStartButton.disabled = true;
      modalThumb.innerHTML = `
        <div class="modal-loading">
          <div class="loading-spinner"></div>
          <div>Setting up Sidecast…</div>
        </div>
      `;

      try {
        const [commentsRes, insightsRes] = await Promise.all([
          fetch(`${API_BASE}/comments/${video.id}`),
          fetch(`${API_BASE}/video/${video.id}/insights`),
        ]);
        const [comments, insights] = await Promise.all([commentsRes.json(), insightsRes.json()]);
        sessionStorage.setItem(`sidecast:preload:${video.id}`, JSON.stringify({ comments, insights }));
      } catch (err) {
        console.error("preload failed, watch page will load its own data", err);
      }

      location.href = watchUrl(video.id);
    });
  </script>
</body>
</html>
